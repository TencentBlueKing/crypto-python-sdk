name: Unittest

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --editable ".[gm]" pytest

      - name: Run tests
        run: python -m pytest -q

  standard-algorithms-without-gm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install standard dependencies
        run: python -m pip install --editable . pytest

      - name: Verify RSA and AES without GM extra
        run: python -m pytest -q tests/test_optional_dependencies.py
